name: 定时器探针

# 临时诊断用：验证 GitHub 到底会不会按 schedule 触发这个仓库。
# 不碰账本、不跑策略，只打印时间。确认完立即删除。

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 打印触发信息
        run: |
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "cst=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
